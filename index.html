<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Form</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./script.js"></script>
</head>
<body>
    <div id="page-body">
        <div id="image-holder">
            <img id="form-banner" src="./cow.jpg">
            <p>Photo by <a href="https://unsplash.com/@3tnik?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">A. C.</a> on <a href="https://unsplash.com/photos/brown-cow-in-close-up-photography-uKbL3Vp5iKc?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a></p>
        </div>
        <form method="post">
            <label for="first-name">First Name</label>
            <input type="text" id="first-name" name="first-name" autocomplete="given-name">

            <label for="last-name">Last Name</label>
            <input type="text" id="last-name" name="last-name" autocomplete="family-name">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email"> 

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" autocomplete="mobile">

            <label for="password">Password</label>
            <input type="password" id="password" name="password">

            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" name="password">

            <button type="submit" id="subscribe">Subscribe</button>
            <label for="subscribe">Already subscribed? <a href="./index.html">Log in</a> to manage your subscription</label>
        </form>
    </div>
</body>
</html>
